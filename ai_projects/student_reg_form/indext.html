
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f3f5;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #111;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: 2px solid #4285e9;
            border-color: transparent;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #3079ed;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .save-btn:hover {
            background: #185abc;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
        }

        .search {
            margin: 25px 0 15px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 13px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background: #3079ed;
            color: white;
        }

        .edit-btn, .delete-btn {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin: 2px;
        }

        .edit-btn {
            background: #f0ad25;
        }

        .delete-btn {
            background: #dc3545;
        }

        .empty {
            color: #777;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <!-- Registration Form -->

    <form id="studentForm">

        <div class="form-grid">

            <input
                type="number"
                id="studentId"
                placeholder="ID"
                min="1"
                step="1"
                required
            >

            <input
                type="text"
                id="studentName"
                placeholder="Name"
                maxlength="50"
                required
            >

            <input
                type="number"
                id="studentAge"
                placeholder="Age"
                min="5"
                max="100"
                step="1"
                required
            >

            <select id="studentCourse" required>
                <option value="">Select Course</option>
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
            </select>

            <input
                type="email"
                id="studentEmail"
                placeholder="Email"
                required
            >

        </div>

        <button type="submit" class="save-btn" id="saveBtn">
            Save Student
        </button>

        <p id="message" class="message" role="status"></p>

    </form>

    <!-- Search -->

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search students..."
    >

    <!-- Students Table -->

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

</div>


<script>

    // 1. Get HTML elements

    const form = document.getElementById("studentForm");

    const idInput = document.getElementById("studentId");
    const nameInput = document.getElementById("studentName");
    const ageInput = document.getElementById("studentAge");
    const courseInput = document.getElementById("studentCourse");
    const emailInput = document.getElementById("studentEmail");

    const table = document.getElementById("studentTable");
    const saveBtn = document.getElementById("saveBtn");
    const searchInput = document.getElementById("search");
    const message = document.getElementById("message");


    // 2. Load students from localStorage

    let students = [];

    try {
        students = JSON.parse(localStorage.getItem("students")) || [];

        if (!Array.isArray(students)) {
            students = [];
        }
    } catch {
        students = [];
    }

    let editId = null;


    // 3. Save students

    function saveStudents() {

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );

    }


    // 4. Display students in table

    function displayStudents(list = students) {

        table.innerHTML = "";

        if (list.length === 0) {

            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 6;
            cell.textContent = "No students found.";
            cell.className = "empty";

            row.appendChild(cell);
            table.appendChild(row);

            return;
        }

        list.forEach(student => {

            const row = document.createElement("tr");

            // Student information

            [
                student.id,
                student.name,
                student.age,
                student.course,
                student.email
            ].forEach(value => {

                const cell = document.createElement("td");

                cell.textContent = value;

                row.appendChild(cell);

            });


            // Action buttons

            const actions = document.createElement("td");

            const editBtn = document.createElement("button");

            editBtn.textContent = "Edit";
            editBtn.className = "edit-btn";

            editBtn.addEventListener("click", function() {
                editStudent(student.id);
            });


            const deleteBtn = document.createElement("button");

            deleteBtn.textContent = "Delete";
            deleteBtn.className = "delete-btn";

            deleteBtn.addEventListener("click", function() {
                deleteStudent(student.id);
            });


            actions.appendChild(editBtn);
            actions.appendChild(deleteBtn);

            row.appendChild(actions);

            table.appendChild(row);

        });

    }


    // 5. Form validation

    function validateStudent(id, name, age, course, email) {

        // ID validation

        if (
            id === "" ||
            !Number.isSafeInteger(Number(id)) ||
            Number(id) <= 0
        ) {
            return "Please enter a valid Student ID.";
        }


        // Name validation

        const namePattern = /^[\p{L}][\p{L}\s'-]{2,49}$/u;

        if (!namePattern.test(name)) {
            return "Name must contain 3-50 letters.";
        }


        // Age validation

        if (
            age === "" ||
            !Number.isInteger(Number(age)) ||
            Number(age) < 5 ||
            Number(age) > 100
        ) {
            return "Age must be between 5 and 100.";
        }


        // Course validation

        if (course === "") {
            return "Please select a course.";
        }


        // Email validation

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
            return "Please enter a valid email address.";
        }


        // Duplicate ID validation

        const duplicate = students.find(student =>
            String(student.id) === id &&
            String(student.id) !== String(editId)
        );

        if (duplicate) {
            return "This Student ID already exists.";
        }


        return null;

    }


    // 6. Add or Update student

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const id = idInput.value.trim();
        const name = nameInput.value.trim();
        const age = ageInput.value.trim();
        const course = courseInput.value;
        const email = emailInput.value.trim();


        // Validate inputs

        const error = validateStudent(
            id, name, age, course, email
        );

        if (error) {

            message.textContent = error;
            message.style.color = "red";

            return;
        }


        // Create student object

        const studentData = {
            id: Number(id),
            name: name,
            age: Number(age),
            course: course,
            email: email
        };


        if (editId !== null) {

            // Update existing student

            students = students.map(student =>

                String(student.id) === String(editId)
                    ? studentData
                    : student

            );

            message.textContent = "Student updated successfully!";

        } else {

            // Add new student

            students.push(studentData);

            message.textContent = "Student added successfully!";

        }


        message.style.color = "green";

        // Save and display

        saveStudents();

        displayStudents();

        form.reset();

        editId = null;

        saveBtn.textContent = "Save Student";

    });


    // 7. Edit student

    function editStudent(id) {

        const student = students.find(student =>
            String(student.id) === String(id)
        );

        if (!student) return;


        idInput.value = student.id;
        nameInput.value = student.name;
        ageInput.value = student.age;
        courseInput.value = student.course;
        emailInput.value = student.email;


        editId = student.id;

        saveBtn.textContent = "Update Student";

        message.textContent = "Editing student information.";
        message.style.color = "#d18b00";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // 8. Delete student

    function deleteStudent(id) {

        const confirmDelete = confirm(
            "Are you sure you want to delete this student?"
        );

        if (!confirmDelete) return;


        students = students.filter(student =>
            String(student.id) !== String(id)
        );


        // Cancel editing if deleted student was being edited

        if (String(editId) === String(id)) {

            form.reset();

            editId = null;

            saveBtn.textContent = "Save Student";

        }


        saveStudents();

        displayStudents();

        message.textContent = "Student deleted successfully!";
        message.style.color = "green";

    }


    // 9. Search students

    searchInput.addEventListener("input", function() {

        const searchValue = searchInput.value.toLowerCase();

        const filteredStudents = students.filter(student =>

            String(student.id).includes(searchValue) ||

            student.name.toLowerCase().includes(searchValue) ||

            String(student.age).includes(searchValue) ||

            student.course.toLowerCase().includes(searchValue) ||

            student.email.toLowerCase().includes(searchValue)

        );


        displayStudents(filteredStudents);

    });


    // 10. Initial display

    displayStudents();

</script>

</body>
</html>
